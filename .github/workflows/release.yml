name: Release

on:
  push:
    tags: ['v*']

jobs:
  # The published tarball is pure JavaScript - the native dependencies are
  # compiled or fetched on the installing machine - so it is built once and the
  # same bytes are what every smoke test installs and what npm receives.
  pack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # `npm ci` ignores better-sqlite3's `gypfile: false` and injects a
      # `node-gyp rebuild` for it, because the lockfile does not carry that
      # flag and binding.gyp is in the package. It then needs a C++ toolchain
      # for a module that ships working prebuilds - which is why this fails on
      # the Windows runner, whose Visual Studio 18 node-gyp cannot even parse.
      # Users never hit it: npx and a plain `npm install` have no lockfile and
      # honour the flag.
      - run: npm ci --ignore-scripts

      # --ignore-scripts also skips node-pty's, which is the one that can matter.
      # The pinned prerelease ships prebuilds for all three platforms, so this is
      # a no-op today - it is here so a version without them compiles rather than
      # silently installing nothing.
      - run: npm rebuild node-pty
      - run: npm run typecheck
      - run: npm test

      # A release bumps two versions: packages/hub/package.json and HUB_VERSION
      # in packages/hub/src/hub.ts, which peer compatibility is gated on. The
      # drift between those two is caught by version.test.ts in the step above;
      # this one catches the tag disagreeing with either.
      - name: Refuse a tag that disagrees with package.json
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./packages/hub/package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "tag $GITHUB_REF_NAME does not match package version $pkg" >&2
            exit 1
          fi

      - run: npm run build
      - run: npm run pack:npm -w @termscape/hub

      - uses: actions/upload-artifact@v4
        with:
          name: tarball
          path: packages/hub/npm/*.tgz
          if-no-files-found: error

  # The gate PLAN.md asks for: install the real artifact the way a user would,
  # on every platform, and make sure the thing starts and serves its UI.
  smoke:
    needs: pack
    name: smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: actions/download-artifact@v4
        with:
          name: tarball
          path: tarball

      - name: Install globally
        shell: bash
        run: npm install -g ./tarball/*.tgz

      - name: Starts and reports its version
        shell: bash
        run: |
          got="$(termscape --version)"
          echo "version: $got"
          test -n "$got"

      - name: Serves the canvas
        shell: bash
        env:
          TERMSCAPE_HOME: ${{ runner.temp }}/termscape-home
        run: |
          mkdir -p "$TERMSCAPE_HOME"
          # --no-open because CI has no browser to hand the URL to.
          termscape --port 7789 --no-open --token ci-smoke-token > hub.log 2>&1 &
          for _ in $(seq 1 60); do
            curl -sf http://127.0.0.1:7789/health >/dev/null && break
            sleep 1
          done
          echo "--- hub.log ---"; cat hub.log
          curl -sf http://127.0.0.1:7789/health
          # The UI is the half most likely to be lost in packaging: the hub
          # finds it by a different relative path once installed.
          curl -sf http://127.0.0.1:7789/ | grep -q '<div id="root">'
          echo "canvas served ok"

  publish:
    needs: smoke
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # The OIDC token npm exchanges for a short-lived publish credential, and
      # what provenance is signed against. Trusted publishing is configured on
      # the package at npmjs.com: this repo, this workflow file by name. There
      # is no npm token anywhere here, which is the point - the one that was
      # here expired, and an expiring credential in a secret is the failure
      # mode this replaces rather than renews.
      id-token: write
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      # OIDC publishing needs npm 11.5.1 or newer. Node 24 ships one already,
      # but which one moves with the runner image, so it is pinned here rather
      # than assumed - the failure is at publish time, after a full release has
      # been built and smoke-tested.
      - name: Use an npm that can publish over OIDC
        run: npm install -g npm@latest

      - uses: actions/download-artifact@v4
        with:
          name: tarball
          path: tarball

      # No NODE_AUTH_TOKEN, and deliberately not an empty one: `setup-node`
      # writes an `_authToken` line into .npmrc that expands to whatever the
      # variable holds, and an empty value is still a value - npm tries it and
      # fails with ENEEDAUTH instead of falling back to OIDC. Unset is what
      # makes it ask GitHub for a token instead.
      #
      # `--provenance` is gone for the same reason: trusted publishing from a
      # public repo to a public package generates it automatically, so the flag
      # says nothing the run does not already do.
      - name: Publish to npm
        shell: bash
        run: npm publish ./tarball/*.tgz --access public
